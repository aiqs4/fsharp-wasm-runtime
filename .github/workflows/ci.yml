name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the compiler (private repo): needs a token that can read aiqs4/fsharp-wasm — secret FSHARP_WASM_TOKEN
      - uses: actions/checkout@v6
        with: { repository: aiqs4/fsharp-wasm, path: fsharp-wasm, ref: develop, token: "${{ secrets.FSHARP_WASM_TOKEN }}", submodules: false }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Patched F# compiler
        id: fsc
        uses: ./fsharp-wasm/.github/actions/patched-fsc
      - name: Install wasm-tools
        run: |
          URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest | python3 -c "import sys,json; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if 'x86_64-linux' in a['name'] and a['name'].endswith('.tar.gz')][0])")
          curl -sSL "$URL" | tar xz && sudo install -m755 wasm-tools-*/wasm-tools /usr/local/bin/wasm-tools
      - name: Build the demos
        env: { FSHARP_WASM: "${{ github.workspace }}/fsharp-wasm", FSHARP_COMPILER: "${{ steps.fsc.outputs.fsc }}" }
        run: ./build.sh
      - name: The committed site is up to date
        run: git diff --stat --exit-code -- site/wasm site/runtime || (echo "::error::run ./build.sh and commit site/"; exit 1)
      - name: End-to-end tests (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/e2e.mjs
