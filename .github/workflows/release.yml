name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install fsharp-wasm compiler
        run: |
          curl -L https://github.com/fsharp-wasm/fsharp-wasm/releases/latest/download/fsharp-wasm-linux-x64.tar.gz \
            | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/fable

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: bash build/release.sh ${GITHUB_REF_NAME#v}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish NuGet package
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish npm packages
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cd tools/npm-package && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nupkg/*.nupkg
            dist/demos/**/*.wasm

      - name: Deploy demo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

