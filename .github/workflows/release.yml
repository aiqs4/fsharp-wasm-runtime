name: Release

# Tagging vX.Y.Z publishes a GitHub release with the showcase site as a zip (landing page + prebuilt demos), after the
# end-to-end tests have run against exactly what is zipped.  No compiler is needed: site/ holds the prebuilt demos.
# (A NuGet / npm package is not published yet.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # job level, so `if: env.NODE_AUTH_TOKEN` below can see it
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test the site
        run: |
          node tests/e2e/site.mjs
          E2E_ROOT=site node tests/e2e/demos.mjs

      - name: Zip the site (with the runtime sources, README and LICENSE)
        run: |
          name="fsharp-wasm-runtime-site-${GITHUB_REF_NAME}"
          mkdir -p "out/$name"
          cp -r site/. "out/$name/"
          cp -r runtime "out/$name/runtime-src"
          cp LICENSE README.md "out/$name/"
          (cd out && zip -qr "../$name.zip" "$name" -x '*.DS_Store')

      - name: Checksum
        run: sha256sum fsharp-wasm-runtime-site-*.zip > "fsharp-wasm-runtime-site-${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}   # v0.2.0-experimental, v1.0.0-rc.1 …
          files: |
            fsharp-wasm-runtime-site-*.zip
            fsharp-wasm-runtime-site-*.zip.sha256

      # needs the NPM_TOKEN secret; without it the step is skipped.  The package ships the runtime/ glue next to index.js.
      - name: Publish npm package
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cp -r runtime tools/npm-package/runtime
          cd tools/npm-package
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          tag=latest; [[ "$GITHUB_REF_NAME" == *-* ]] && tag=next   # a prerelease must not become `latest`
          npm publish --access public --tag "$tag"
