<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Dashboard — F# → WasmGC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    .count-display     { font-size: 3rem; text-align: center; font-weight: bold; }
    .button-group      { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
    .input-group       { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .input-group input { flex: 1; }
    .done              { text-decoration: line-through; opacity: .6; }
    .hint              { font-size: .85rem; opacity: .7; }
  </style>
</head>
<body>
  <header class="container">
    <nav><a href="../../index.html">← All Demos</a><span>F# → WasmGC</span></nav>
    <hgroup>
      <h1>Full Dashboard</h1>
      <p>All demos combined in a single tabbed layout — Counter, Todo, Canvas, PubSub and Storage.</p>
    </hgroup>
  </header>

  <main class="container">
    <article id="status-banner"><p id="status">Loading…</p></article>
    <div id="dashboard-root"></div>
  </main>

  <script type="module">
    import { boot } from "../../runtime/boot.js";
    boot({ wasm: new URL("Dashboard.wasm", import.meta.url), entry: "start" });
  </script>
</body>
</html>
